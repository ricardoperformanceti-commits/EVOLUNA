<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modelos · Sorriso com IA</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1e9;color:#254a39;font-family:Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 28px;background:white;border-bottom:1px solid #dbe5d3;flex-wrap:wrap}h1{font-size:20px;letter-spacing:-.7px;margin:0}p{font-size:12px;color:#849576;margin:7px 0 0}nav{display:flex;gap:7px;flex-wrap:wrap}button,a{font:12px Arial,sans-serif;border:1px solid #dce5d5;border-radius:8px;padding:11px 15px;background:#fff;color:#4a6d3d;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#1d4e3d;border-color:#1d4e3d;color:white}button:focus-visible,a:focus-visible{outline:3px solid #aac485;outline-offset:3px}main{padding:25px 20px;overflow:auto;min-height:calc(100vh - 100px)}.size-label{margin:0 0 16px;text-align:center;font-size:11px;color:#8c9f7c}.device{background:#234a38;border-radius:22px;padding:10px;box-shadow:0 18px 60px #1d49391c;margin:0 auto;overflow:hidden;transition:width .2s}.device.computador{border-radius:12px;padding:8px}iframe{display:block;border:0;background:#f6f7f5;transform-origin:top left;border-radius:13px}.computador iframe{border-radius:6px}.frame-holder{overflow:hidden;border-radius:13px}.loading{font-size:11px;color:#7b916c;text-align:center;margin-top:17px}@media(max-width:600px){header{padding:18px}nav{width:100%}nav button{flex:1;padding:11px}main{padding:20px 10px}h1{font-size:18px}.open-system{font-size:10px;padding:9px}}@media(prefers-reduced-motion:reduce){.device{transition:none}}
</style></head><body><header><div><h1>◡ Sorriso com IA</h1><p>Escolha um formato e navegue no sistema.</p></div><nav aria-label="Formato da visualização"><button data-device="celular" aria-pressed="true">Celular</button><button data-device="tablet" aria-pressed="false">Tablet</button><button data-device="computador" aria-pressed="false">Computador</button></nav><a class="open-system" href="/">Abrir sistema ↗</a></header><main><p class="size-label" id="size-label">Celular · 390 × 844</p><div class="device" id="device"><div class="frame-holder" id="frame-holder"><iframe id="app-frame" title="Sistema no formato celular" src="/#inicio" allow="camera; microphone; display-capture; fullscreen; clipboard-write" referrerpolicy="same-origin"></iframe></div></div><p class="loading">A prévia é interativa. Se reduzida, use “Abrir sistema” para visualizar no tamanho do seu dispositivo.</p></main><script>
const models={celular:{w:390,h:844,label:'Celular'},tablet:{w:834,h:1112,label:'Tablet'},computador:{w:1440,h:1000,label:'Computador'}};let selected='celular';function resize(){const model=models[selected],device=document.getElementById('device'),holder=document.getElementById('frame-holder'),frame=document.getElementById('app-frame');const scale=Math.min(1,(document.querySelector('main').clientWidth-40)/model.w);device.className='device '+selected;device.style.width=model.w*scale+20+'px';holder.style.width=model.w*scale+'px';holder.style.height=model.h*scale+'px';frame.style.width=model.w+'px';frame.style.height=model.h+'px';frame.style.transform='scale('+scale+')';frame.title='Sistema no formato '+model.label.toLowerCase();document.getElementById('size-label').textContent=model.label+' · '+model.w+' × '+model.h;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===selected)))}document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-device]');if(b){selected=b.dataset.device;resize()}});window.addEventListener('resize',resize);resize();
</script></body></html>
