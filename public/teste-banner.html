<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparar banners — Sorriso com IA</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#1d4e3d;font:16px system-ui,sans-serif}main{max-width:1440px;margin:40px auto;padding:20px}h1{font-size:26px;margin:0 0 10px}p{color:#62776a;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}button,a{font:inherit;border:1px solid #c6d4c7;background:white;border-radius:8px;padding:12px 18px;color:inherit;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#1d4e3d;color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #92b764;outline-offset:3px}figure{margin:0}figure img{display:block;width:100%;height:auto;border-radius:12px}figcaption{margin-top:16px;font-weight:600}footer{margin-top:28px;font-size:14px}footer a{display:inline-block}small{display:block;margin-top:18px;color:#64776a}</style></head><body><main><h1>Qual imagem combina mais com o banner?</h1><p>Veja uma opção por vez, com o mesmo texto e composição.</p><nav aria-label="Selecionar imagem"><button data-option="1" aria-pressed="true">1 · Mulher sorrindo</button><button data-option="2" aria-pressed="false">2 · Atendimento odontológico</button></nav><figure><img id="banner" src="/assets/banner-opcao-1.png" width="2098" height="749" alt="Prévia ilustrativa do banner com mulher sorrindo"><figcaption id="caption">Opção 1 · Mulher sorrindo</figcaption></figure><small>Montagens ilustrativas geradas com IA a partir das referências enviadas. O banner principal do sistema permanece como estava.</small><footer><a href="/#inicio">Voltar ao sistema</a></footer></main><script>const titles={1:'Mulher sorrindo',2:'Atendimento odontológico'};function select(value){const option=value==='2'?'2':'1';document.querySelector('#banner').src='/assets/banner-opcao-'+option+'.png';document.querySelector('#banner').alt='Prévia ilustrativa do banner: '+titles[option];document.querySelector('#caption').textContent='Opção '+option+' · '+titles[option];document.querySelectorAll('[data-option]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.option===option)));history.replaceState(null,'','#'+option)}document.querySelectorAll('[data-option]').forEach(button=>button.addEventListener('click',()=>select(button.dataset.option)));select(location.hash.slice(1));</script></body></html>
